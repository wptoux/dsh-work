# dsh-ui-tweaks bundle patch
#
# Mounts the host half of the plugin into the dsh web profile. The client
# half (lib/client.js, discovered through the `dsh.client` package field)
# runs in the browser and implements the UI tweaks (completed-turn folding).
- insert:
    - id: ui-tweaks
      name: 'dsh-ui-tweaks'