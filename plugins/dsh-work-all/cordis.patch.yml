# dsh-work-all bundle patch
#
# Aggregate carrier for the dsh-work plugin family: install this one package
# and both remaining plugins mount at once (package.json dependencies pull in
# the sibling packages; this patch inserts their rows under a dsh-work-*
# namespace so the aggregate can coexist with standalone installs of the same
# plugins).
#
# 2026-11-06: the family shrank to two plugins. dsh-better-sidebar,
# dsh-archive-manager, dsh-model-sync and dsh-ui-tweaks were removed because
# DSH 0.2.2 ships native equivalents (right sidebar, archive browsing, model
# catalog sync, and the narrow-screen sidebar drawer). Their sources remain in
# git history (see tag plugins-2026.09.2 and
# .git-backup/pre-plugin-removal-2026-11-06.bundle).
#
# Hand-maintained (no generator): when the family gains or drops a plugin,
# update this patch AND package.json dependencies together.

- insert:
    - id: dsh-work-remote-web-ui
      name: 'dsh-remote-web-ui'

- insert:
    - id: dsh-work-usage-stats
      name: 'dsh-usage-stats'
